[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "wigle2kml-py"
version = "0.1.0"
description = "Convert Wigle API JSON output to KML for Google Earth and other geo tools."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }  # Change if you choose a different license
authors = [
  { name = "Kent Ickler" }
]
keywords = ["wigle", "kml", "wifi", "geospatial", "google-earth"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Topic :: Security",
  "Topic :: Utilities",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]

# Add any non-stdlib requirements here if needed, e.g.:
dependencies = [
  # "simplekml>=1.3",
]

[project.urls]
Homepage = "https://github.com/DefensiveOrigins/Wigle2KML-py"
Source = "https://github.com/DefensiveOrigins/Wigle2KML-py"
Issues = "https://github.com/DefensiveOrigins/Wigle2KML-py/issues"

[project.scripts]
wigle2kml = "wigle2kml:main"

[tool.hatch.build.targets.wheel]
# Tell hatchling explicitly what to include since we have a single loose .py file.
include = [
  "wigle2kml.py",
  "README.md",
]

[tool.hatch.build.targets.sdist]
include = [
  "wigle2kml.py",
  "README.md",
]
